name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Desktop build variant
        required: true
        default: compact
        type: choice
        options:
          - compact
          - exact

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      OTITENET_DESKTOP_VARIANT: ${{ inputs.variant }}
      OTITENET_PYINSTALLER_ONEFILE: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-desktop.txt
            requirements-export.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install -r requirements-export.txt

      - name: Verify offline deployment payload
        shell: pwsh
        run: |
          $deploymentDir = "data/mobile_deployments/current"
          $manifestPath = Join-Path $deploymentDir "manifest.json"
          if (!(Test-Path $manifestPath)) {
            Write-Error "Missing offline deployment payload: $manifestPath"
            throw "Offline deployment payload is incomplete. Commit the compact files under data/mobile_deployments/current before building the Windows installer."
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $requiredFiles = @($manifestPath)
          foreach ($property in $manifest.files.PSObject.Properties) {
            $filename = [string]$property.Value
            if ($filename -and $filename -ne "manifest.json") {
              $requiredFiles += (Join-Path $deploymentDir (Split-Path $filename -Leaf))
            }
          }
          $missingFiles = $requiredFiles | Where-Object { !(Test-Path $_) }
          if ($missingFiles.Count -gt 0) {
            $missingFiles | ForEach-Object { Write-Error "Missing offline deployment payload: $_" }
            throw "Offline deployment payload is incomplete. Commit the compact files under data/mobile_deployments/current before building the Windows installer."
          }

      - name: Build Windows Streamlit sidecar
        shell: pwsh
        run: |
          python -m PyInstaller packaging/pyinstaller/otitenet_streamlit.spec --clean -y
          if (!(Test-Path "dist/otitenet-streamlit.exe")) {
            throw "Missing PyInstaller output: dist/otitenet-streamlit.exe"
          }
          New-Item -ItemType Directory -Force -Path "desktop/src-tauri/binaries" | Out-Null
          Copy-Item "dist/otitenet-streamlit.exe" "desktop/src-tauri/binaries/otitenet-streamlit-x86_64-pc-windows-msvc.exe" -Force

      - name: Install frontend dependencies
        shell: pwsh
        run: |
          Push-Location desktop
          npm ci
          Pop-Location

      - name: Build Windows NSIS installer
        shell: pwsh
        run: |
          $tauriConfigPath = "desktop/src-tauri/tauri.conf.json"
          $tauriConfig = Get-Content $tauriConfigPath -Raw | ConvertFrom-Json
          $tauriConfig.bundle.PSObject.Properties.Remove("resources")
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content $tauriConfigPath -Encoding UTF8
          Push-Location desktop
          npm run tauri:build -- --bundles nsis
          Pop-Location

      - name: Upload Windows sidecar
        uses: actions/upload-artifact@v4
        with:
          name: otitenet-windows-sidecar-${{ inputs.variant }}
          path: dist/otitenet-streamlit.exe
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: otitenet-windows-installer-${{ inputs.variant }}
          path: desktop/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
