[package]
name = "otitenet-desktop"
version = "0.9.0"
description = "Offline desktop shell for the Otitenet Streamlit app"
authors = ["Otitenet"]
edition = "2021"

[lib]
name = "otitenet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["net", "time"] }
